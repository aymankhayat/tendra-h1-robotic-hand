<!doctype html><meta charset="utf-8">
<title>TENDRA-H1 share card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 627px; overflow: hidden; background: #050506; font-family: Sora, sans-serif; color: #fff; }
  .art { position: absolute; inset: 0 0 0 38%; background: url(../../web/assets/ai_hero_rings.jpg) 40% 50% / cover;
    -webkit-mask: linear-gradient(90deg, transparent, #000 30%); mask: linear-gradient(90deg, transparent, #000 30%); }
  .glow { position: absolute; inset: 0; background: radial-gradient(500px circle at 20% 90%, rgba(138, 92, 255, .25), transparent 70%); }
  .copy { position: absolute; left: 64px; top: 70px; width: 620px; display: grid; gap: 22px; }
  .eyebrow { font: 500 15px "JetBrains Mono", monospace; letter-spacing: .2em; color: #a2a2ae; display: flex; gap: 12px; align-items: center; }
  .eyebrow i { width: 18px; height: 7px; background: radial-gradient(circle at 3.5px 3.5px, #ff4fd8 3.3px, transparent 3.6px), radial-gradient(circle at 14.5px 3.5px, #4f7bff 3.3px, transparent 3.6px); }
  h1 { margin: 0; font-size: 66px; line-height: 1.02; letter-spacing: -.03em; }
  h1 em { font-style: normal; background: linear-gradient(90deg, #fff, #b9b2ff 55%, #ff9bea); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .stats { display: flex; gap: 34px; margin-top: 18px; }
  .stats b { display: block; font-size: 40px; letter-spacing: -.03em; }
  .stats span { font: 500 13px "JetBrains Mono", monospace; letter-spacing: .12em; color: #8d8d96; }
  .by { position: absolute; left: 64px; bottom: 50px; font: 500 17px "JetBrains Mono", monospace; color: #cfcfd8; }
  .by b { color: #fff; }
</style>
<div class="art"></div><div class="glow"></div>
<div class="copy">
  <div class="eyebrow"><i></i>TENDRA-H1 · ROBOTIC HAND</div>
  <h1>Generated from <em>one Python script</em></h1>
  <div class="stats"><div><b>25</b><span>JOINTS</span></div><div><b>309</b><span>PARTS</span></div><div><b>0</b><span>INTERFERENCES</span></div></div>
</div>
<div class="by">Designed &amp; built by <b>Ayman Khayat</b> · Blender · three.js</div>
